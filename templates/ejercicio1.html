{% extends "base.html" %}

{% block title %}Ejercicio 1 - Notas{% endblock %}

{% block content %}
<div class="card">
    <h2>Formulario de Notas</h2>
    <form method="POST">
        <div class="form-group">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" name="nota1" min="10" max="70" step="0.1" required>
        </div>
        <div class="form-group">
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" name="nota2" min="10" max="70" step="0.1" required>
        </div>
        <div class="form-group">
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" name="nota3" min="10" max="70" step="0.1" required>
        </div>
        <div class="form-group">
            <label for="asistencia">Asistencia (%):</label>
            <input type="number" id="asistencia" name="asistencia" min="0" max="100" required>
        </div>
        <button type="submit" class="btn-enviar">Enviar</button>
    </form>

    {% if promedio is not none %}
    <div class="resultado">
        <p>{{ promedio }}</p>
        <p>{{ estado }}</p>
    </div>
    {% endif %}
</div>
{% endblock %}
